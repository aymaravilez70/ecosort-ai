[project]
name = "ecosort-ai-backend"
version = "1.0.0"
description = "EcoSort AI - API de clasificacion inteligente de productos excedentes"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
